{% extends 'base.html' %}
{% block title %}今日{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='today.js') }}" defer></script>{% endblock %}
{% block content %}
<header class="page-heading">
  <div><h1>今天，学一点</h1><p id="today-date">正在加载今天的安排…</p></div>
  <a class="button" href="/notes/new">新建笔记</a>
</header>
<section id="today-exams" aria-label="考试倒计时" hidden></section>
<div class="grid-two">
  <section class="panel" aria-labelledby="todos-heading">
    <div class="panel__heading"><h2 id="todos-heading">到期待办</h2><span class="badge" id="todos-count">0 项</span></div>
    <p class="muted">包含今天及之前到期的任务。</p>
    <label class="todo-item__check"><input type="checkbox" id="todos-show-all"><span>查看所有待办与已完成任务</span></label>
    <ul class="item-list" id="today-todos" aria-live="polite"><li class="empty-state">正在加载待办…</li></ul>
  </section>
  <section class="panel" aria-labelledby="cards-heading">
    <div class="panel__heading"><h2 id="cards-heading">今日复习</h2><span class="badge" id="cards-count">0 张</span></div>
    <p class="muted">先尝试回忆，再翻看答案。按 1 / 3 / 7 / 15 天安排复习。</p>
    <div id="today-cards" aria-live="polite"><p class="empty-state">正在加载复习卡…</p></div>
  </section>
</div>
{% endblock %}
